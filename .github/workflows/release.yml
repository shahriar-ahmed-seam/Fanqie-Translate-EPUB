name: Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Sanitize environment for CI
        run: |
          # Strip local-machine trustStore if the path does not exist on this runner
          LOCAL_CACERTS="/home/shahriar/.jdk/jdk-21/usr/lib/jvm/java-21-openjdk-amd64/lib/security/cacerts"
          if [ ! -f "$LOCAL_CACERTS" ]; then
            echo "Sanitizing gradle.properties for CI environment..."
            sed -i 's|-Djavax.net.ssl.trustStore=[^ ]*||g' gradle.properties
            sed -i 's|-Djavax.net.ssl.trustStorePassword=[^ ]*||g' gradle.properties
            sed -i 's|-Djavax.net.ssl.trustStoreType=[^ ]*||g' gradle.properties
          fi

      - name: Determine next semantic version
        id: versioning
        run: |
          git fetch --tags --force

          # Find the latest release tag adhering to semver vX.Y.Z
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            MAJOR=1
            MINOR=0
            PATCH=0
          else
            CLEAN_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            PATCH=$((PATCH + 1))
          fi

          # Prevent duplicate tags if tag exists locally or on remote
          while git rev-parse -q --verify "refs/tags/v${MAJOR}.${MINOR}.${PATCH}" >/dev/null 2>&1 || \
                git ls-remote --tags origin "refs/tags/v${MAJOR}.${MINOR}.${PATCH}" 2>/dev/null | grep -q "refs/tags/v${MAJOR}.${MINOR}.${PATCH}"; do
            echo "Tag v${MAJOR}.${MINOR}.${PATCH} already exists. Incrementing patch..."
            PATCH=$((PATCH + 1))
          done

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG_NAME="v${NEXT_VERSION}"

          # Monotonically increasing version code based on tag version and commit count
          TOTAL_COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          CALC_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if [ "$CALC_CODE" -gt "$TOTAL_COMMITS" ]; then
            VERSION_CODE=$CALC_CODE
          else
            VERSION_CODE=$TOTAL_COMMITS
          fi
          if [ "$VERSION_CODE" -le 0 ]; then
            VERSION_CODE=1
          fi

          echo "version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Target release: ${NEXT_VERSION} (versionCode: ${VERSION_CODE}, tag: ${TAG_NAME})"

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --no-build-cache \
            -PversionName="${{ steps.versioning.outputs.version }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}"

      - name: Verify APK and BuildConfig version
        id: verify_apk
        run: |
          # 1. Verify BuildConfig.java matches target version
          BUILDCFG=$(find app/build/generated/source/buildConfig/debug -name "BuildConfig.java" | head -n 1)
          if [ -z "$BUILDCFG" ] || [ ! -f "$BUILDCFG" ]; then
            echo "::error::BuildConfig.java was not generated during build"
            exit 1
          fi
          ACTUAL_VERSION=$(grep -o 'VERSION_NAME = "[^"]*"' "$BUILDCFG" | cut -d'"' -f2)
          echo "Expected version: ${{ steps.versioning.outputs.version }}"
          echo "BuildConfig actual version: ${ACTUAL_VERSION}"
          if [ "$ACTUAL_VERSION" != "${{ steps.versioning.outputs.version }}" ]; then
            echo "::error::Version mismatch! Expected ${{ steps.versioning.outputs.version }} but BuildConfig has ${ACTUAL_VERSION}"
            exit 1
          fi

          # 2. Locate generated APK
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" ! -name "*-unaligned.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Debug APK was not found in app/build/outputs/apk/debug"
            exit 1
          fi

          # 3. Check minimum valid file size (> 1MB)
          APK_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || echo "0")
          echo "Found APK: $APK_FILE (${APK_SIZE} bytes)"
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "::error::APK file size ($APK_SIZE bytes) is suspiciously small or invalid"
            exit 1
          fi

          # 4. Prepare release artifact with clean versioned name
          RELEASE_APK="app/build/outputs/apk/debug/EPUB-Translator-v${{ steps.versioning.outputs.version }}.apk"
          cp "$APK_FILE" "$RELEASE_APK"
          echo "apk_path=$RELEASE_APK" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.versioning.outputs.tag }}" -m "Release ${{ steps.versioning.outputs.tag }}"
          git push origin "${{ steps.versioning.outputs.tag }}"

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "EPUB Translator ${{ steps.versioning.outputs.tag }}"
          body: |
            ### EPUB Translator ${{ steps.versioning.outputs.tag }}

            Automated Debug APK Release for sideloading.
            - Version: ${{ steps.versioning.outputs.version }}
            - Version Code: ${{ steps.versioning.outputs.version_code }}
          files: ${{ steps.verify_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
