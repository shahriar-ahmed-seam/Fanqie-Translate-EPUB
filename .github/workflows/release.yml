name: Automated Release

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Calculate Next Version and Version Code
        id: versioning
        run: |
          # Fetch all tags
          git fetch --tags --force
          
          # Find latest semver tag
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
            NEXT_CODE=1
          else
            CLEAN_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
            PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEXT_CODE=$(git rev-list --count HEAD)
          fi
          
          TAG_NAME="v${NEXT_VERSION}"
          echo "version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "versionCode=${NEXT_CODE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Calculated Next Release: $TAG_NAME with versionCode $NEXT_CODE"

      - name: Check if Tag Already Exists (Prevent Duplicate Releases)
        run: |
          if git rev-parse "${{ steps.versioning.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.versioning.outputs.tag }} already exists. Skipping release."
            exit 0
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Ensure Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            python3 -c "import base64; open('debug.keystore', 'wb').write(base64.b64decode(open('debug.keystore.base64').read().strip()))"
          fi

      - name: Build Debug APK with Dynamic Version
        run: |
          ./gradlew assembleDebug -PversionCode=${{ steps.versioning.outputs.versionCode }} -PversionName=${{ steps.versioning.outputs.version }} --no-daemon

      - name: Locate and Rename Debug APK
        id: apk
        run: |
          SRC_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ] || [ ! -f "$SRC_APK" ]; then
            echo "Error: Debug output APK not found!"
            exit 1
          fi
          DEST_APK="app/build/outputs/apk/debug/EPUB-Translator-${{ steps.versioning.outputs.tag }}.apk"
          mv "$SRC_APK" "$DEST_APK"
          echo "apk_path=$DEST_APK" >> $GITHUB_OUTPUT
          echo "Renamed APK to $DEST_APK"

      - name: Generate Release Notes
        id: notes
        run: |
          PREV_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline -n 10)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline)
          fi
          
          NOTES="### EPUB Translator ${{ steps.versioning.outputs.tag }}
          
          #### What's Changed
          ${COMMITS}
          
          #### Built with Automated CI/CD
          - Native TomatoMTL Translation Engine
          - Multi-Book Concurrency Queue
          - Valid EPUB Structure & Spine Preservation
          "
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.versioning.outputs.tag }}" -m "Release ${{ steps.versioning.outputs.tag }}"
          git push origin "${{ steps.versioning.outputs.tag }}"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "EPUB Translator ${{ steps.versioning.outputs.tag }}"
          body: ${{ steps.notes.outputs.release_notes }}
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
